
spring.application.name=backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/saferoute
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:SafeRouteAiSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Detected local Live Server port 5501 & 5500)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5501,http://127.0.0.1:5501,http://localhost:5500,http://127.0.0.1:5500}
