spring.application.name=backend-test

# Use in-memory H2 database for tests to run independently of local MySQL password
spring.datasource.url=jdbc:h2:mem:saferoutedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Test Configuration
jwt.secret=SafeRouteAiSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026
jwt.expiration=86400000

# CORS Test Configuration
app.cors.allowed-origins=http://localhost:5501,http://127.0.0.1:5501,http://localhost:5500,http://127.0.0.1:5500

